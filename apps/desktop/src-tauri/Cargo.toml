[package]
name = "kaling-timer"
version = "0.2.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
base64 = "0.22"
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
