version: 1
maxSeconds: 120
aliases:
  p1_bird_scroll: [鸟画卷, 画卷, 鸟]
  p1_bird_flight: [鸟飞行, 飞行, 鸟]
  p1_tiger_pillars: [虎柱子, 虎柱子连线]
  p1_dog_minigame: [狗, 狗小游戏]
  p2_kaling_flight: [卡琳飞行, 飞行]
  p2_kaling_minigame: [卡琳小游戏, 小游戏]
  p3_fullscreen: [卡琳全屏, 全屏]
templates:
  - { pattern: "{skill}校准", operation: cast }
  - { pattern: "{skill}校准{seconds}秒", operation: remaining }
  - { pattern: "{skill}加{seconds}秒", operation: add }
  - { pattern: "{skill}减{seconds}秒", operation: subtract }
  - { pattern: "撤销{skill}校准", operation: undo }
commands:
  - { utterance: 开始战斗, action: { type: start } }
  - { utterance: 重置战斗, action: { type: reset } }
  - { utterance: 进入二阶段, action: { type: phase, phase: p2 } }
  - { utterance: 进入三阶段, action: { type: phase, phase: p3 } }
  - { utterance: 三兽死亡, action: { type: last-peril-death } }
  - { utterance: 虎柱子开始, action: { type: trigger-tiger } }
  - { utterance: 鸟区域校准, action: { type: calibrate-zone, zone: bird } }
  - { utterance: 虎区域校准, action: { type: calibrate-zone, zone: tiger } }
  - { utterance: 狗区域校准, action: { type: calibrate-zone, zone: dog } }
  - { utterance: 撤销鸟区域校准, action: { type: undo-zone, zone: bird } }
  - { utterance: 撤销虎区域校准, action: { type: undo-zone, zone: tiger } }
  - { utterance: 撤销狗区域校准, action: { type: undo-zone, zone: dog } }
